name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install compressor dependencies
        working-directory: compressor
        run: npm ci

      - name: Export compression-test corpus
        # 压缩测试语料 = 构建期默认参数替换后的最终代码（逐块），不是仓库里的原始 l 行
        run: python scripts/export_segments.py

      - name: Run compressor tests
        working-directory: compressor
        run: npm run test:local

      - name: Build and assemble publish directory
        run: python scripts/build_site.py

      - name: Audit publish contents
        shell: bash
        run: |
          set -euo pipefail

          # 发布目录只应包含构建产物与运行时资源：不得出现源码/测试/文档/依赖
          if find _site \( -name '*.py' -o -name '*.lua' -o -name '*.md' \
               -o -name 'node_modules' -o -name 'package.json' -o -name 'package-lock.json' \) \
               -print -quit | grep -q .; then
            echo 'Publish directory must not contain source, tests, docs or dependencies.' >&2
            exit 1
          fi

          if find _site -type l -print -quit | grep -q .; then
            echo 'Publish directory must not contain symbolic links.' >&2
            exit 1
          fi

          find _site -type f -printf '%P\n' | LC_ALL=C sort
          echo 'Publish manifest verified: only required website files will be uploaded.'

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
