name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install compressor dependencies
        working-directory: compressor
        run: npm ci

      - name: Generate site HTML
        run: python GenerateHtml.py

      - name: Assemble deploy directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/compressor/src

          cp index.html favicon.svg CNAME _site/
          cp \
            assets/basement-panel.webp \
            assets/basement-room.webp \
            assets/challenge-page-background.webp \
            assets/challenge-sheet.webp \
            assets/inconsolata-bold.ttf \
            assets/isaac-pixel-subset.woff2 \
            assets/menu-cursor.png \
            assets/paper-surface.webp \
            assets/repentance-logo.png \
            _site/assets/

          cp compressor/index.html compressor/core.js _site/compressor/
          cp compressor/src/*.js _site/compressor/src/
          cp compressor/node_modules/luaparse/luaparse.js _site/compressor/luaparse.js
          cp compressor/node_modules/fengari-web/dist/fengari-web.js _site/compressor/fengari-web.js

      - name: Audit deploy contents
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/pages-expected.txt" <<'EOF'
          CNAME
          assets/basement-panel.webp
          assets/basement-room.webp
          assets/challenge-page-background.webp
          assets/challenge-sheet.webp
          assets/inconsolata-bold.ttf
          assets/isaac-pixel-subset.woff2
          assets/menu-cursor.png
          assets/paper-surface.webp
          assets/repentance-logo.png
          compressor/core.js
          compressor/fengari-web.js
          compressor/index.html
          compressor/luaparse.js
          compressor/src/analyze.js
          compressor/src/canonical.js
          compressor/src/compress.js
          compressor/src/encode.js
          compressor/src/folds.js
          compressor/src/plan.js
          compressor/src/search.js
          favicon.svg
          index.html
          EOF

          find _site -type f -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/pages-actual.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/pages-expected.txt" "$RUNNER_TEMP/pages-expected.txt"
          diff -u "$RUNNER_TEMP/pages-expected.txt" "$RUNNER_TEMP/pages-actual.txt"

          if find _site -type l -print -quit | grep -q .; then
            echo 'Deployment directory must not contain symbolic links.' >&2
            exit 1
          fi

          echo 'Deployment manifest verified: only required website files will be uploaded.'

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
